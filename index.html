<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一份深度认知请求</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .hidden { display: none; }
    </style>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-6">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-8 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1.5 bg-slate-100">
            <div id="progress" class="h-full bg-indigo-500 transition-all duration-500" style="width: 0%"></div>
        </div>
        <form id="survey-form">
            <div id="step-container">
                <div class="step fade-in" id="step-1">
                    <h1 class="text-2xl font-bold text-slate-800 mb-2">嘿！我想听听你的真话</h1>
                    <p class="text-slate-500 mb-8">这是一次关于我的“他择”实验。首先，怎么称呼你？</p>
                    <input type="text" name="name" required class="w-full border-b-2 border-slate-100 focus:border-indigo-500 outline-none py-3 text-lg transition" placeholder="你的名字">
                    <button type="button" onclick="next(1)" class="mt-10 w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold">开始填写</button>
                </div>
            </div>
            <div id="step-final" class="step hidden fade-in text-center">
                <div class="text-5xl mb-6">✨</div>
                <h2 class="text-xl font-bold text-slate-800 mb-4">反馈已收到</h2>
                <p class="text-slate-500 mb-8">感谢你陪我完成这次探索。点击下方按钮完成最后提交。</p>
                <button type="submit" id="submit-btn" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold">确认发送</button>
            </div>
        </form>
    </div>
    <script>
        const questions = ["回想初次相识，你对我最深刻的 3 个直觉印象是什么？","在你认识的所有人里，你觉得我身上哪种特质是最罕见、最难以取代的？","你觉得我在谈论什么话题时，眼神里最有“光”？","你觉得我的存在，更像是一团“温暖的火”，还是一个“深邃的湖”？","如果我突然去创业，你会建议我做“掌舵者”还是“压舱石”？","当我陷入低谷时，你觉得我最需要的支持方式是什么？","你觉得我在社交场合中展示出的“距离感”通常是因为什么？","如果我是一本还没写完的书，你觉得下章是“破浪前行”还是“大隐于市”？","在你眼中，我更倾向于“直觉驱动”还是“逻辑至上”？","有没有哪种才华，是你觉得我拥有但还没被大家看到的？","如果要给我提一个能让我变得更好的“真诚差评”，你会说什么？","在什么样的情况下，你会毫不犹豫地把一件大事交给我？","如果必须用一个词来定义我的“精神底色”，你会选哪个词？","最后，有没有一句话是你想送给现在或未来的我的？"];
        let current = 1;
        const container = document.getElementById('step-container');
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyau7lCR1wdWWSs06g6bZFSrweukSchqGs4G2q3Wp5YFMAhSSxEK-KCrGGzHYlngc0X/exec';
        questions.forEach((q, i) => {
            const stepId = i + 2;
            const div = document.createElement('div');
            div.id = `step-${stepId}`;
            div.className = "step hidden fade-in";
            div.innerHTML = `<label class="block text-xs font-bold text-indigo-400 uppercase tracking-widest mb-2">Question ${stepId}/15</label><h2 class="text-xl font-bold text-slate-800 mb-6">${q}</h2><textarea name="q${stepId}" rows="4" class="w-full bg-slate-50 border-none rounded-2xl p-4 focus:ring-2 focus:ring-indigo-500 outline-none transition" placeholder="输入你的回答..."></textarea><button type="button" onclick="next(${stepId})" class="mt-8 w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold">下一题</button>`;
            container.appendChild(div);
        });
        function next(stepId) {
            const currentEl = document.getElementById(`step-${stepId}`);
            const input = currentEl.querySelector('input, textarea');
            if (input && !input.value.trim()) { alert("留点笔墨吧，这对我很重要。"); return; }
            currentEl.classList.add('hidden');
            current++;
            const nextEl = document.getElementById(`step-${current}`) || document.getElementById('step-final');
            nextEl.classList.remove('hidden');
            document.getElementById('progress').style.width = (current / 16 * 100) + '%';
        }
        document.getElementById('survey-form').addEventListener('submit', e => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true; btn.innerText = "提交中...";
            fetch(scriptURL, { method: 'POST', body: new FormData(e.target)})
            .then(res => { alert('提交成功！谢谢你！'); btn.innerText = "已完成"; })
            .catch(err => alert('提交中，请稍后确认：' + err.message));
        });
    </script>
</body>
</html>
